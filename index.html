      Quote: (props) => <Icon {...props} path={<><path d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1z" /><path d="M15 21c3 0 7-1 7-8V5c0-1.25-.757-2.017-2-2h-4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1z" /></>} />
    };

    // --- 2. CONFIG & GLOBALS ---
    const { useState, useEffect } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyAmqq8gwFTvpFH3rVfL43xurnbU7tWh0h4",
      authDomain: "kumaranwedding-b59d6.firebaseapp.com",
      projectId: "kumaranwedding-b59d6",
      storageBucket: "kumaranwedding-b59d6.firebasestorage.app",
      messagingSenderId: "281972038441",
      appId: "1:281972038441:web:a46195c908003dd59b3538",
      measurementId: "G-XKS7R1C63C"
    };

    const finalConfig = typeof window.__firebase_config !== 'undefined'
      ? JSON.parse(window.__firebase_config)
      : firebaseConfig;

    firebase.initializeApp(finalConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    if (firebase.analytics && typeof firebase.analytics.isSupported === 'function') {
      firebase.analytics.isSupported().then((isSupported) => {
        if (isSupported) firebase.analytics();
      });
    } else if (firebase.analytics) {
      firebase.analytics();
    }

    const appId = typeof window.__app_id !== 'undefined' ? window.__app_id : 'wedding-rishi-marilyn';

    // --- 3. COMPONENTS ---

    const MandalaBg = () => (
      <div className="fixed inset-0 pointer-events-none z-0 opacity-[0.03] bg-mandala-pattern bg-[length:60px_60px]"></div>
    );

    // Decorative Components
    const HangingBell = ({ className, delay = "0s" }) => (
      <div className={`absolute top-0 pointer-events-none ${className}`} style={{ animationDelay: delay }}>
        <div className="flex flex-col items-center origin-top animate-sway">
          {/* Chain */}
          <div className="w-0.5 h-16 md:h-24 bg-gradient-to-b from-gold to-deepRed/50"></div>
          {/* Bell */}
          <div className="relative text-gold drop-shadow-md">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor" className="transform -translate-y-1">
              <path d="M12 2C8.13 2 5 5.13 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.87-3.13-7-7-7zm0 18c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z" />
            </svg>
          </div>
          {/* Floral tip */}
          <div className="w-1.5 h-1.5 rounded-full bg-deepRed mt-1"></div>
        </div>
      </div>
    );

    const Peacock = ({ className, flip = false }) => (
      <div className={`absolute pointer-events-none z-0 opacity-10 md:opacity-15 text-deepRed ${className}`}>
        <svg width="200" height="200" viewBox="0 0 100 100" fill="currentColor" className={flip ? 'transform scale-x-[-1]' : ''}>
          <path d="M50 80 C40 80 30 70 30 50 C30 30 40 20 50 20 C60 20 70 30 70 50 C70 70 60 80 50 80 Z M50 25 C55 25 58 20 55 15" fill="none" stroke="currentColor" strokeWidth="1" />
          <path d="M50 20 L50 5 L45 10 M50 5 L55 10" stroke="currentColor" strokeWidth="1" fill="none" />
          <circle cx="50" cy="50" r="15" fill="none" stroke="currentColor" strokeWidth="0.5" />
          <path d="M10 90 Q 50 100 90 90" stroke="currentColor" strokeWidth="2" fill="none" />
        </svg>
      </div>
    );

    const Diya = ({ className }) => (
      <div className={`absolute bottom-0 pointer-events-none ${className}`}>
        <div className="relative flex flex-col items-center">
          {/* Flame */}
          <div className="w-3 h-3 md:w-4 md:h-4 bg-orange-500 rounded-full blur-[2px] animate-pulse mb-1"></div>
          {/* Lamp */}
          <svg width="40" height="24" viewBox="0 0 40 24" className="text-gold drop-shadow-sm">
            <path d="M2 12 Q 20 24 38 12 L 38 8 Q 20 18 2 8 Z" fill="currentColor" />
            <path d="M2 8 Q 20 18 38 8" fill="none" stroke="#B8860B" strokeWidth="1" />
          </svg>
        </div>
      </div>
    );

    const DecorationCorner = ({ position }) => {
      const rotation =
        position === 'top-left' ? 'rotate-0' :
          position === 'top-right' ? 'rotate-90' :
            position === 'bottom-right' ? 'rotate-180' :
              'rotate-270';

      const posClass =
        position === 'top-left' ? 'top-0 left-0' :
          position === 'top-right' ? 'top-0 right-0' :
            position === 'bottom-right' ? 'bottom-0 right-0' :
              'bottom-0 left-0';

      return (
        <div className={`fixed ${posClass} w-32 h-32 md:w-48 md:h-48 z-10 pointer-events-none opacity-40 text-gold transform ${rotation}`}>
          <svg viewBox="0 0 100 100" fill="currentColor" className="w-full h-full">
            <path d="M0 0 L100 0 C100 0 90 10 90 20 C90 60 60 90 20 90 C10 90 0 100 0 100 Z" fill="none" stroke="currentColor" strokeWidth="1.5" />
            <image href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238B0000' stroke-width='1' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 7a5 5 0 0 1 5 5 5 5 0 0 1-5 5 5 5 0 0 1-5 5 5 5 0 0 1 5-5z'/%3E%3Cpath d='M12 2v3'/%3E%3Cpath d='M12 19v3'/%3E%3Cpath d='M19 12h3'/%3E%3Cpath d='M2 12h3'/%3E%3C/svg%3E" x="5" y="5" width="20" height="20" opacity="0.5" />
          </svg>
        </div>
      );
    };

    const MusicPlayer = () => {
      const [isPlaying, setIsPlaying] = useState(false);
      const audioRef = React.useRef(null);

      useEffect(() => {
        const audio = audioRef.current;
        if (audio) {
          audio.volume = 0.5;

          const handleAutoPlay = async () => {
            try {
              await audio.play();
              setIsPlaying(true);
            } catch (err) {
              console.log("Autoplay blocked, waiting for interaction", err);
              setIsPlaying(false);

              // Fallback: Play on first interaction
              const enableAudio = () => {
                audio.play().then(() => {
                  setIsPlaying(true);
                  // Clean up listeners
                  document.removeEventListener('click', enableAudio);
                  document.removeEventListener('touchstart', enableAudio);
                  document.removeEventListener('keydown', enableAudio);
                }).catch(e => console.error("Still blocked", e));
              };

              document.addEventListener('click', enableAudio);
              document.addEventListener('touchstart', enableAudio);
              document.addEventListener('keydown', enableAudio);
            }
          };

          handleAutoPlay();
        }
      }, []);

      const togglePlay = () => {
        if (!audioRef.current) return;
        if (isPlaying) {
          audioRef.current.pause();
          setIsPlaying(false);
        } else {
          audioRef.current.play();
          setIsPlaying(true);
        }
      };

      return (
        <>
          <audio
            ref={audioRef}
            src="background-music.mp3"
            loop
            preload="auto"
            autoPlay
          />
          <button
            onClick={togglePlay}
            className={`fixed bottom-6 left-6 z-50 p-3 rounded-full shadow-lg border-2 border-gold transition-all duration-500 ${isPlaying ? 'bg-deepRed text-gold animate-pulse-slow' : 'bg-bg text-deepRed opacity-70 hover:opacity-100'}`}
            title={isPlaying ? "Pause Music" : "Play Music"}
          >
            <div className={`${isPlaying ? 'animate-spin-slow' : ''}`}>
              <Icons.Music size={24} />
            </div>
            {/* Sound Wave Animation (CSS only) */}
            {isPlaying && (
              <span className="absolute -top-1 -right-1 flex h-3 w-3">
                <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-gold opacity-75"></span>
                <span className="relative inline-flex rounded-full h-3 w-3 bg-gold"></span>
              </span>
            )}
          </button>
        </>
      );
    };

    const App = () => {
      const [activeTab, setActiveTab] = useState('home');
      const [user, setUser] = useState(null);
      const [loading, setLoading] = useState(true);
      const [showSplash, setShowSplash] = useState(true);
      const [startMusic, setStartMusic] = useState(false);
      const [timeLeft, setTimeLeft] = useState({ days: 0, hours: 0, minutes: 0, seconds: 0 });
      const [showAdminPanel, setShowAdminPanel] = useState(false);
      const [adminPassword, setAdminPassword] = useState('');
      const [allRsvps, setAllRsvps] = useState([]);
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [isSubmitted, setIsSubmitted] = useState(false);
      const [errorMessage, setErrorMessage] = useState(null);

      const [rsvpData, setRsvpData] = useState({
        name: '', phone: '', guests: 1,
        events: { welcome: true, haldi_21: true, haldi: true, wedding: true, reception: true },
        message: ''
      });

      useEffect(() => {
        const initAuth = async () => {
          try {
            if (typeof window.__initial_auth_token !== 'undefined' && window.__initial_auth_token) {
              await auth.signInWithCustomToken(window.__initial_auth_token);
            } else {
              await auth.signInAnonymously();
            }
          } catch (e) {
            console.warn("Auth failed, mock mode.");
            setUser({ uid: 'guest-mock', isAnonymous: true });
          } finally { setLoading(false); }
        };
        initAuth();
        return auth.onAuthStateChanged(setUser);
      }, []);

      useEffect(() => {
        if (!user || !showAdminPanel || adminPassword !== 'rishi2026') return;
        try {
          const rsvpsRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('rsvps');
          return rsvpsRef.onSnapshot(
            (snapshot) => {
              const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
              data.sort((a, b) => (b.submittedAt?.seconds || 0) - (a.submittedAt?.seconds || 0));
              setAllRsvps(data);
            },
            (error) => console.error("Sync error:", error)
          );
        } catch (err) { console.error("Firestore error:", err); }
      }, [user, showAdminPanel, adminPassword]);

      useEffect(() => {
        const targetDate = new Date('August 22, 2026 16:00:00').getTime();
        const timer = setInterval(() => {
          const now = new Date().getTime();
          const distance = targetDate - now;
          if (distance < 0) setTimeLeft({ days: 0, hours: 0, minutes: 0, seconds: 0 });
          else setTimeLeft({
            days: Math.floor(distance / (1000 * 60 * 60 * 24)),
            hours: Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)),
            minutes: Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60)),
            seconds: Math.floor((distance % (1000 * 60)) / 1000),
          });
        }, 1000);
        return () => clearInterval(timer);
      }, []);

      const events = [
        { id: 'welcome', title: 'Welcome & Bachelor Party (By Invite Only)', subtitle: 'The Beginning of Celebration', date: 'August 20, 2026', time: '7:00 PM', venue: 'Noci Adante, Chennai', mapUrl: 'https://maps.google.com/?q=Noci+Adante+Chennai', icon: <Icons.GlassWater strokeWidth={1.5} />, theme: 'DRESS TO IMPRESS' },
        { id: 'haldi_21', title: 'Patti and Athai Nalungu', subtitle: 'Traditional Ceremony', date: 'August 21, 2026', time: '6:00 PM - 10:00 PM', venue: 'Venue Not Decided', mapUrl: '#', icon: <Icons.Sparkles strokeWidth={1.5} />, theme: 'Blessings in Bloom' },
        { id: 'haldi', title: 'Haldi & Mehndi', subtitle: 'The Saffron Celebration', date: 'August 22, 2026', time: '4:00 PM', venue: 'Blue House, ECR, Chennai', mapUrl: 'https://maps.google.com/?q=Blue+House+ECR+Chennai', icon: <Icons.Music strokeWidth={1.5} />, theme: 'YELLOW & BRIGHT' },
        { id: 'wedding', title: 'Wedding Ceremony', subtitle: 'The Auspicious Vows', date: 'August 23, 2026', time: '9:30 AM', venue: 'The Leela Palace, Chennai', mapUrl: 'https://maps.google.com/?q=The+Leela+Palace+Chennai', icon: <Icons.Flower2 strokeWidth={1.5} />, theme: 'TRADITIONAL SILK' },
        { id: 'reception', title: 'Sangeet & Cocktail', subtitle: 'Dance & Celebration', date: 'August 24, 2026', time: '6:30 PM', venue: 'Pullman, Chennai', mapUrl: 'https://maps.google.com/?q=Pullman+Chennai', icon: <Icons.GlassWater strokeWidth={1.5} />, theme: 'An Evening of Rhythm & Revelry' }
      ];

      const handleSubmitRsvp = async (e) => {
        e.preventDefault();
        const isMockMode = finalConfig.apiKey.includes('PLACEHOLDER');
        if (!user && !isMockMode) { setErrorMessage("Connecting..."); return; }
        setIsSubmitting(true);
        setErrorMessage(null);
        try {
          if (isMockMode) {
            await new Promise(resolve => setTimeout(resolve, 1500));
            console.log("Mock RSVP:", rsvpData);
            setIsSubmitted(true);
          } else {
            const rsvpsRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('rsvps');
            await rsvpsRef.add({ ...rsvpData, submittedAt: firebase.firestore.FieldValue.serverTimestamp(), uid: user ? user.uid : 'anonymous' });
            setIsSubmitted(true);
          }
        } catch (err) {
          console.error("RSVP User Error:", err);
          setErrorMessage(err.message || "Failed to save RSVP.");
        } finally { setIsSubmitting(false); }
      };

      const adjustGuests = (d) => setRsvpData(p => ({ ...p, guests: Math.max(1, p.guests + d) }));

      if (loading) {
        return (
          <div className="min-h-screen flex flex-col items-center justify-center bg-bg text-deepRed">
            <div className="animate-spin-slow text-gold mb-6"><Icons.Flower2 size={60} /></div>
            <p className="font-royal uppercase tracking-[0.3em] text-xs">Loading Celebration</p>
          </div>
        );
      }

      if (showSplash) {
        return (
          <div className="fixed inset-0 z-50 flex flex-col items-center justify-center bg-bg text-deepRed animate-in cursor-pointer" onClick={() => { setShowSplash(false); setStartMusic(true); }}>
            <div className="scale-125 mb-8 text-gold animate-pulse-slow"><Icons.Flower2 size={80} /></div>
            <h1 className="font-script text-6xl md:text-8xl mb-4 text-center px-4">Rishi & Marilyn</h1>
            <p className="font-royal uppercase tracking-[0.3em] text-sm md:text-base mb-12 text-gold">The Wedding Celebration</p>

            <button
              className="group relative px-8 py-3 bg-transparent overflow-hidden rounded-full transition-all hover:bg-deepRed hover:text-gold border border-deepRed"
            >
              <div className="absolute inset-0 w-3 bg-gold transition-all duration-[250ms] ease-out group-hover:w-full opacity-10"></div>
              <span className="relative flex items-center gap-3 font-royal uppercase tracking-widest text-xs font-bold">
                Enter Invitation <Icons.ArrowRight size={14} />
              </span>
            </button>
            <p className="absolute bottom-10 text-[10px] uppercase tracking-widest text-textSecondary opacity-50">Click anywhere to begin</p>
          </div>
        );
      }

      const renderContent = () => {
        if (activeTab === 'admin') {
          if (adminPassword !== 'rishi2026') {
            return (
              <div className="glass-panel p-10 rounded-xl max-w-sm mx-auto animate-in border border-deepRed/20">
                <div className="text-center mb-6">
                  <Icons.ShieldCheck className="mx-auto text-deepRed mb-2" size={32} />
                  <h2 className="font-royal text-xl text-deepRed">Host Access</h2>
                </div>
                <input type="password" autoFocus className="w-full bg-white/50 border-b-2 border-deepRed/30 p-3 text-center text-xl font-serif focus:outline-none focus:border-deepRed transition-colors" placeholder="••••" onChange={(e) => setAdminPassword(e.target.value)} />
              </div>
            );
          }
          const eventStats = allRsvps.reduce((acc, c) => {
            const g = Number(c.guests) || 0;
            if (c.events?.welcome) acc.welcome += g;
            if (c.events?.haldi_21) acc.haldi_21 += g;
            if (c.events?.haldi) acc.haldi += g;
            if (c.events?.wedding) acc.wedding += g;
            if (c.events?.reception) acc.reception += g;
            acc.total += g; return acc;
          }, { welcome: 0, haldi_21: 0, haldi: 0, wedding: 0, reception: 0, total: 0 });

          return (
            <div className="glass-panel p-8 rounded-2xl animate-in text-left">
              <h3 className="font-royal text-2xl text-deepRed mb-6 border-b border-deepRed/10 pb-4">RSVP Dashboard</h3>
              <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                <div className="bg-white/60 p-4 rounded-lg border border-deepRed/10 text-center"><p className="text-[10px] uppercase text-deepRed font-bold">Total Guests</p><p className="font-serif text-3xl text-deepRed">{eventStats.total}</p></div>
                <div className="bg-white/60 p-4 rounded-lg border border-deepRed/10 text-center"><p className="text-[10px] uppercase text-deepRed font-bold">Responses</p><p className="font-serif text-3xl text-deepRed">{allRsvps.length}</p></div>
              </div>
              <div className="space-y-4">
                {allRsvps.map(r => (
                  <div key={r.id} className="bg-white/80 p-6 rounded-xl border border-gold/20 shadow-sm">
                    <div className="flex justify-between items-start">
                      <div><h4 className="font-royal text-deepRed text-lg">{r.name}</h4><p className="text-xs text-textSecondary uppercase tracking-widest">{r.guests} guests • {r.phone}</p></div>
                      <span className="text-[10px] font-bold text-gold bg-deepRed/5 px-2 py-1 rounded">
                        {r.submittedAt?.toDate ? r.submittedAt.toDate().toLocaleDateString() : 'Just now'}
                      </span>
                    </div>
                    <div className="mt-2 flex flex-wrap gap-2">{Object.keys(r.events || {}).filter(k => r.events[k]).map(k => <span key={k} className="text-[9px] bg-gold/10 text-deepRed px-2 py-0.5 rounded uppercase">{events.find(e => e.id === k)?.title.split(' ')[0] || k}</span>)}</div>
                    {r.message && <div className="mt-3 p-3 bg-bg rounded border-l-2 border-gold text-sm italic text-textSecondary">"{r.message}"</div>}
                  </div>
                ))}
                {allRsvps.length === 0 && <p className="text-center text-textSecondary italic">Waiting for responses...</p>}
              </div>
            </div>
          );
        }

        switch (activeTab) {
          case 'home':
            return (
              <div className="animate-in text-center space-y-12 py-10 relative">
                {/* Decorative Top - Hanging Bells */}
                <HangingBell className="left-10 md:left-24 delay-75" />
                <HangingBell className="right-10 md:right-24 delay-150" />
                <HangingBell className="left-1/4 hidden md:block delay-300" />
                <HangingBell className="right-1/4 hidden md:block delay-500" />

                <div className="space-y-4 relative z-10 pt-20">
                  <p className="text-gold font-royal text-md md:text-xl tracking-[0.2em] uppercase font-bold">THE CELEBRATION OF A LIFETIME</p>
                  <h1 className="font-script text-7xl md:text-9xl text-deepRed drop-shadow-sm p-4 leading-[1.3]">
                    Rishi <span className="text-gold text-5xl md:text-7xl">&</span> Marilyn
                  </h1>
                  <p className="font-royal text-textSecondary text-xs md:text-sm tracking-[0.2em] uppercase">
                    August 20, 2026 - August 24, 2026 <br />
                    <span className="text-deepRed font-bold mt-2 block">CHENNAI • INDIA</span>
                  </p>
                </div>

                {/* Countdown */}
                <div className="glass-panel inline-block px-10 py-8 rounded-full border-2 border-double border-gold/40 shadow-xl relative mt-8">
                  <div className="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-bg px-2 text-deepRed"><Icons.Flower2 size={20} /></div>
                  <div className="flex gap-8 md:gap-14 text-deepRed">
                    {Object.entries(timeLeft).map(([k, v]) => (
                      <div key={k} className="flex flex-col items-center">
                        <span className="font-serif text-4xl md:text-5xl">{String(v).padStart(2, '0')}</span>
                        <span className="text-[9px] uppercase tracking-widest text-gold font-bold mt-1">{k}</span>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="pt-12 max-w-lg mx-auto relative z-10">
                  <p className="font-serif italic text-xl md:text-2xl text-textSecondary mb-8 leading-relaxed">
                    "As the sun sets over the ocean, we begin our new horizon. Two souls, two cultures, one beautiful journey."
                  </p>
                  <button onClick={() => setActiveTab('schedule')} className="group relative px-12 py-4 bg-deepRed text-bg rounded-md font-royal uppercase tracking-[0.25em] text-xs font-bold overflow-hidden border border-deepRed hover:bg-bg hover:text-deepRed transition-all duration-500 shadow-lg hover:shadow-gold/20">
                    <span className="relative z-10 flex items-center gap-2">View Events <Icons.ChevronRight size={14} /></span>
                  </button>
                </div>
              </div>
            );
          case 'schedule':
            return (
              <div className="animate-in pb-24 space-y-12">
                <div className="text-center pt-8 mb-12">
                  <p className="text-[10px] uppercase tracking-[0.4em] text-deepRed font-bold mb-2">August 2026</p>
                  <h2 className="font-script text-6xl text-deepRed mb-2">The Itinerary</h2>
                  <div className="flex justify-center gap-2 text-gold"><Icons.Sparkles size={16} /><Icons.Sparkles size={16} /></div>
                </div>

                <div className="grid gap-8 max-w-2xl mx-auto">
                  {events.map((e, i) => (
                    <div key={e.id} className="group relative bg-white border-l-4 border-deepRed p-8 shadow-md hover:shadow-xl hover:-translate-y-1 transition-all duration-500 overflow-hidden">
                      <div className="absolute -right-6 -bottom-6 text-gold/10 pointer-events-none transform -rotate-12 transition-transform group-hover:rotate-0">
                        {React.cloneElement(e.icon, { size: 140 })}
                      </div>

                      <div className="flex flex-col md:flex-row gap-6 relative z-10 items-center md:items-start text-center md:text-left">
                        <div className="flex flex-col items-center shrink-0">
                          <div className="w-16 h-16 rounded-full border-2 border-gold/30 flex items-center justify-center text-deepRed bg-bg shadow-inner">
                            <span className="font-royal text-xl font-bold">{i + 1}</span>
                          </div>
                          <div className="h-full w-px bg-gold/20 my-2 md:hidden"></div>
                        </div>

                        <div className="flex-1 space-y-2">
                          <span className="text-[9px] uppercase tracking-[0.2em] font-bold text-gold block mb-1">{e.theme}</span>
                          <h3 className="font-royal text-2xl text-deepRed">{e.title}</h3>
                          <p className="font-serif italic text-textSecondary text-lg">{e.subtitle}</p>

                          <div className="grid grid-cols-1 md:grid-cols-2 gap-x-4 gap-y-2 pt-4 text-sm text-textSecondary font-medium">
                            <div className="flex items-center gap-2 justify-center md:justify-start"><Icons.Calendar size={14} className="text-gold" /> {e.date}</div>
                            <div className="flex items-center gap-2 justify-center md:justify-start"><Icons.Clock size={14} className="text-gold" /> {e.time}</div>
                            <div className="flex items-center gap-2 justify-center md:justify-start col-span-1 md:col-span-2 mt-1"><Icons.MapPin size={14} className="text-gold" /> {e.venue}</div>
                          </div>

                          {e.mapUrl !== '#' && (
                            <div className="pt-4">
                              <a href={e.mapUrl} target="_blank" className="text-[10px] uppercase font-bold tracking-[0.2em] text-deepRed border-b border-deepRed/20 hover:border-deepRed pb-0.5 transition-colors">View On Map</a>
                            </div>
                          )}
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            );
          case 'rsvp':
            if (isSubmitted) {
              return (
                <div className="animate-in max-w-lg mx-auto glass-panel p-12 text-center rounded-2xl border-2 border-deepRed/10 mt-10">
                  <div className="w-16 h-16 mx-auto bg-deepRed text-bg rounded-full flex items-center justify-center mb-6 shadow-lg"><Icons.Check size={32} /></div>
                  <h2 className="font-royal text-3xl text-deepRed mb-4">Dhanyavad</h2>
                  <p className="font-serif text-textSecondary mb-8 text-lg">We are honored by your response and look forward to celebrating with you.</p>
                  <button onClick={() => { setIsSubmitted(false); setActiveTab('home') }} className="text-xs font-bold uppercase tracking-widest text-deepRed hover:text-gold transition-colors">Back to Home</button>
                </div>
              );
            }
            return (
              <div className="animate-in max-w-3xl mx-auto glass-panel p-8 md:p-14 rounded-2xl md:rounded-[3rem] shadow-2xl border-t-4 border-t-deepRed relative mt-6">
                <div className="text-center mb-10 space-y-2">
                  <h2 className="font-script text-6xl text-deepRed">R.S.V.P</h2>
                  <p className="font-royal text-gold text-xs tracking-[0.3em] uppercase">Please respond by June 15th</p>
                </div>

                {errorMessage && <div className="bg-red-50 text-deepRed p-4 rounded border border-red-200 mb-6 text-center text-sm">{errorMessage}</div>}

                <form onSubmit={handleSubmitRsvp} className="space-y-8">
                  <div className="grid md:grid-cols-2 gap-8">
                    <div className="space-y-1">
                      <label className="text-[10px] uppercase tracking-widest text-deepRed font-bold">Your Name</label>
                      <input type="text" required value={rsvpData.name} onChange={e => setRsvpData({ ...rsvpData, name: e.target.value })} className="w-full bg-transparent border-b border-deepRed/20 py-3 text-lg font-serif focus:outline-none focus:border-deepRed transition-colors placeholder:text-deepRed/20" placeholder="Enter full name" />
                    </div>
                    <div className="space-y-1">
                      <label className="text-[10px] uppercase tracking-widest text-deepRed font-bold">Phone</label>
                      <input type="tel" required value={rsvpData.phone} onChange={e => setRsvpData({ ...rsvpData, phone: e.target.value })} className="w-full bg-transparent border-b border-deepRed/20 py-3 text-lg font-serif focus:outline-none focus:border-deepRed transition-colors placeholder:text-deepRed/20" placeholder="Contact number" />
                    </div>
                  </div>

                  <div className="space-y-4">
                    <label className="text-[10px] uppercase tracking-widest text-deepRed font-bold">Number of Guests</label>
                    <div className="flex items-center gap-6">
                      <button type="button" onClick={() => adjustGuests(-1)} className="w-10 h-10 rounded-full border border-deepRed/20 text-deepRed hover:bg-deepRed hover:text-bg transition-colors flex items-center justify-center"><Icons.Minus size={16} /></button>
                      <span className="font-serif text-3xl text-deepRed w-12 text-center">{rsvpData.guests}</span>
                      <button type="button" onClick={() => adjustGuests(1)} className="w-10 h-10 rounded-full border border-deepRed/20 text-deepRed hover:bg-deepRed hover:text-bg transition-colors flex items-center justify-center"><Icons.Plus size={16} /></button>
                    </div>
                  </div>

                  <div className="space-y-4">
                    <label className="text-[10px] uppercase tracking-widest text-deepRed font-bold">Events Attending</label>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                      {events.map(e => (
                        <div key={e.id} onClick={() => setRsvpData({ ...rsvpData, events: { ...rsvpData.events, [e.id]: !rsvpData.events[e.id] } })} className={`cursor-pointer p-4 border rounded cursor-pointer flex items-center justify-between transition-all ${rsvpData.events[e.id] ? 'bg-deepRed/5 border-deepRed shadow-sm' : 'border-deepRed/10 hover:border-deepRed/30'}`}>
                          <div className="flex items-center gap-3">
                            <div className={`p-2 rounded-full ${rsvpData.events[e.id] ? 'text-deepRed' : 'text-gray-400'}`}>{React.cloneElement(e.icon, { size: 18 })}</div>
                            <div><p className="font-royal text-xs font-bold text-deepRed">{e.title}</p></div>
                          </div>
                          {rsvpData.events[e.id] && <div className="text-gold"><Icons.Check size={16} /></div>}
                        </div>
                      ))}
                    </div>
                  </div>

                  <div className="space-y-1">
                    <label className="text-[10px] uppercase tracking-widest text-deepRed font-bold">Blessings / Message</label>
                    <textarea value={rsvpData.message} onChange={e => setRsvpData({ ...rsvpData, message: e.target.value })} className="w-full bg-transparent border-b border-deepRed/20 py-3 text-lg font-serif focus:outline-none focus:border-deepRed transition-colors placeholder:text-deepRed/20 h-24 resize-none" placeholder="Write a message for the couple..." />
                  </div>

                  <button type="submit" disabled={isSubmitting} className="w-full py-4 bg-deepRed text-bg font-royal uppercase tracking-[0.2em] font-bold text-xs rounded shadow-lg hover:shadow-gold/20 hover:-translate-y-0.5 transition-all disabled:opacity-50">
                    {isSubmitting ? 'Sending...' : 'Confirm Presence'}
                  </button>
                </form>
              </div>
            );
          default: return null;
        }
      };

      return (
        <div className="min-h-screen relative font-sans overflow-hidden">
          <MandalaBg />
          <MusicPlayer shouldPlay={startMusic} />
          <DecorationCorner position="top-left" />
          <DecorationCorner position="top-right" />
          <DecorationCorner position="bottom-left" />
          <DecorationCorner position="bottom-right" />

          {/* Peacocks */}
          <Peacock className="bottom-0 -left-10 w-64 h-64 md:w-96 md:h-96" />
          <Peacock className="bottom-0 -right-10 w-64 h-64 md:w-96 md:h-96" flip={true} />

          {/* Diyas */}
          <Diya className="bottom-8 left-8 md:bottom-12 md:left-20 z-10" />
          <Diya className="bottom-8 right-8 md:bottom-12 md:right-20 z-10" />

          <div className="relative z-20 max-w-4xl mx-auto px-6 pt-10 pb-32">
            <nav className="fixed bottom-10 left-1/2 -translate-x-1/2 z-50">
              <div className="glass-panel p-2 rounded-full flex shadow-[0_20px_50px_rgba(74,4,4,0.2)]">
                {['home', 'schedule', 'rsvp'].map(t => (
                  <button key={t} onClick={() => { setActiveTab(t); setShowAdminPanel(false); window.scrollTo(0, 0) }} className={`px-6 md:px-10 py-3 rounded-full text-[10px] md:text-xs font-royal uppercase tracking-widest transition-all ${activeTab === t ? 'bg-deepRed text-bg shadow-lg transform scale-105' : 'text-deepRed hover:text-gold hover:bg-white/50'}`}>
                    {t}
                  </button>
                ))}
              </div>
            </nav>

            <main>{renderContent()}</main>

            <footer className="text-center mt-20 opacity-60 relative z-10">
              <div className="flex items-center justify-center gap-4 mb-4">
                <span className="h-px w-8 bg-deepRed"></span>
                <Icons.Heart size={12} className="text-deepRed fill-deepRed" />
                <span className="h-px w-8 bg-deepRed"></span>
              </div>
              <p className="font-royal text-[10px] tracking-[0.3em] uppercase text-deepRed">Rishi & Marilyn • 2026</p>
              <button onClick={() => { setShowAdminPanel(!showAdminPanel); if (!showAdminPanel) setActiveTab('admin'); }} className="mt-4 text-[9px] text-textSecondary uppercase tracking-widest hover:text-deepRed">Host Portal</button>
            </footer>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>

</html>
