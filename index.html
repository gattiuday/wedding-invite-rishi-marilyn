<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rishi & Marilyn • Sacred Indian Wedding Invitation</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            turmeric: '#ffcc00',
            kumkum: '#b30000',
            mango: '#2e7d32',
            silk: '#fff9e6',
            gold: '#aa771c',
            peacock: '#005f6b',
            parakeet: '#4caf50',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['Playfair Display', 'serif'],
            traditional: ['Cinzel', 'serif'],
            script: ['Great Vibes', 'cursive'],
          },
          animation: {
            'spin-slow': 'spin 60s linear infinite',
            'petal-fall': 'petalFall linear infinite',
            'float': 'float 6s ease-in-out infinite',
            'sway': 'sway 4s ease-in-out infinite',
            'bell-swing': 'bellSwing 3s ease-in-out infinite',
          },
          keyframes: {
            petalFall: {
              '0%': { transform: 'translate(0, -100px) rotate(0deg)', opacity: '0' },
              '10%': { opacity: '1' },
              '90%': { opacity: '1' },
              '100%': { transform: 'translate(100px, 100vh) rotate(360deg)', opacity: '0' },
            },
            float: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-15px)' },
            },
            sway: {
              '0%, 100%': { transform: 'rotate(-5deg)' },
              '50%': { transform: 'rotate(5deg)' },
            },
            bellSwing: {
              '0%, 100%': { transform: 'rotate(-8deg)' },
              '50%': { transform: 'rotate(8deg)' },
            }
          }
        }
      }
    }
  </script>

  <!-- React & ReactDOM (UMD) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Firebase (Compat/Namespace) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&family=Great+Vibes&family=Cinzel:wght@400;700&display=swap');

    body {
      background-color: #fff9e6;
      background-image: url("https://www.transparenttextures.com/patterns/natural-paper.png");
      -webkit-font-smoothing: antialiased;
    }

    .animate-in {
      animation: revealIn 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes revealIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .glass-nav {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(15px);
      border-top: 2px solid #aa771c44;
    }

    .kolam-bg {
      background-image: url("data:image/svg+xml,%3Csvg width='300' height='300' viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M100 100m-25 0a25 25 0 1 0 50 0a25 25 0 1 0 -50 0 M100 10 L100 40 M100 160 L100 190 M10 100 L40 100 M160 100 L190 100' stroke='%23aa771c' stroke-width='0.4' fill='none' opacity='0.2'/%3E%3C/svg%3E");
    }

    .mango-leaf-toran {
      position: absolute;
      top: 0;
      width: 100%;
      height: 100px;
      background: url("data:image/svg+xml,%3Csvg width='80' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M50 0 C65 40 75 60 50 100 C25 60 35 40 50 0' fill='%232e7d32' /%3E%3Ccircle cx='50' cy='5' r='8' fill='%23ff9800' /%3E%3C/svg%3E") repeat-x;
      background-size: 50px 100px;
      z-index: 51;
    }

    /* Hide scrollbar for Chrome, Safari and Opera */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    /* Hide scrollbar for IE, Edge and Firefox */
    .no-scrollbar {
      -ms-overflow-style: none;
      /* IE and Edge */
      scrollbar-width: none;
      /* Firefox */
    }
  </style>
</head>

<body class="overflow-x-hidden selection:bg-peacock/20">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- ICONS ---
    const Icons = {
      Ganesh: (props) => (
        <svg {...props} viewBox="0 0 100 100" fill="currentColor">
          <path d="M50 10c-15 0-25 12-25 25 0 10 5 18 12 22-4 4-7 10-7 15 0 12 10 20 20 20s20-8 20-20c0-5-3-11-7-15 7-4 12-12 12-22 0-13-10-25-25-25zm0 5c12 0 20 10 20 20s-8 20-20 20-20-10-20-20 8-20 20-20zm-10 45c0-6 4-10 10-10s10 4 10 10-4 10-10 10-10-4-10-10z" opacity="0.9" />
          <path d="M40 60c-5 0-8 5-8 10s3 10 8 10M60 60c5 0 8 5 8 10s-3 10-8 10" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" />
        </svg>
      ),
      Elephant: (props) => (
        <svg {...props} viewBox="0 0 100 100" fill="currentColor">
          <path d="M85 45c-2-8-8-15-25-15-15 0-25 10-30 20-5-5-12-8-20-8-5 0-10 4-10 10 0 15 15 25 25 35 15-5 30-10 40-10 10 0 20 5 25 15 5-2 10-5 10-12 0-10-5-18-15-25zM45 40c5 0 10 5 10 10s-5 10-10 10-10-5-10-10 5-10 10-10z" opacity="0.8" />
        </svg>
      ),
      Peacock: (props) => (
        <svg {...props} viewBox="0 0 100 100" fill="currentColor">
          <path d="M70 25c-5-5-12-8-20-8-18 0-32 12-32 28 0 10 4 18 10 22-2 4-4 8-4 12 0 12 10 22 22 22s22-10 22-22c0-4-2-8-4-12 6-4 10-12 10-22 0-16-14-28-32-28zm0 28c0 10-8 18-18 18s-18-8-18-18 8-18 18-18 18 8 18 18z" />
          <circle cx="50" cy="53" r="10" opacity="0.4" />
        </svg>
      ),
      Parrot: (props) => (
        <svg {...props} viewBox="0 0 100 100" fill="currentColor">
          <path d="M60 20c-10 0-18 8-18 18v10c0 15-10 25-15 25s5 15 15 15 15-10 15-25V38c0-10 8-18 18-18s-5-5-15-5z" />
          <path d="M42 38c0 5 4 10 10 10s10-5 10-10" fill="none" stroke="currentColor" strokeWidth="2" />
        </svg>
      ),
      Bell: (props) => (
        <svg {...props} viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2a2 2 0 0 0-2 2v1.07c-2.84.45-5 2.92-5 5.93V17l-2 2v1h18v-1l-2-2v-6c0-3.01-2.16-5.48-5-5.93V4a2 2 0 0 0-2-2zm0 21a2 2 0 0 1-2-2h4a2 2 0 0 1-2 2z" />
        </svg>
      ),
      Flower: (props) => <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M12 5a3 3 0 1 1 3 3m-3-3a3 3 0 1 0-3 3m3-3v18m0-13a3 3 0 1 1 3 3m-3-3a3 3 0 1 0-3 3m3 8a3 3 0 1 1 3 3m-3-3a3 3 0 1 0-3 3" /></svg>,
      Clock: (props) => <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" /></svg>,
      MapPin: (props) => <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 1 1 16 0Z" /><circle cx="12" cy="10" r="3" /></svg>,
      Check: (props) => <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><polyline points="20 6 9 17 4 12" /></svg>,
      Loader: (props) => <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className={props.className + " animate-spin"}><path d="M21 12a9 9 0 1 1-6.219-8.56" /></svg>
    };

    // --- CONFIG ---
    // Note: API key is left empty as per environment standard.
    const firebaseConfig = {
      apiKey: "AIzaSyAmqq8gwFTvpFH3rVfL43xurnbU7tWh0h4",
      authDomain: "kumaranwedding-b59d6.firebaseapp.com",
      projectId: "kumaranwedding-b59d6",
      storageBucket: "kumaranwedding-b59d6.firebasestorage.app",
      messagingSenderId: "281972038441",
      appId: "1:281972038441:web:a46195c908003dd59b3538"
    };

    const finalConfig = typeof window.__firebase_config !== 'undefined' ? JSON.parse(window.__firebase_config) : firebaseConfig;

    // Initialize Firebase
    if (!firebase.apps.length) {
      firebase.initializeApp(finalConfig);
    }

    const db = firebase.firestore();
    const auth = firebase.auth();
    const appId = typeof window.__app_id !== 'undefined' ? window.__app_id : 'wedding-rishi-marilyn';

    // --- COMPONENTS ---
    const FloatingElement = ({ delay, left, duration, color, children }) => (
      <div
        className="absolute pointer-events-none animate-petal-fall z-0"
        style={{ left: `${left}%`, animationDelay: `${delay}s`, animationDuration: `${duration}s`, color: color }}
      >
        {children}
      </div>
    );

    const App = () => {
      const [activeTab, setActiveTab] = useState('home');
      const [timeLeft, setTimeLeft] = useState({ days: 0, hours: 0, minutes: 0, seconds: 0 });
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [isSubmitted, setIsSubmitted] = useState(false);
      const [rsvpData, setRsvpData] = useState({
        name: '', phone: '', guests: 1, message: '',
        events: { welcome: true, nalungu: true, haldi: true, wedding: true, sangeet: true }
      });

      useEffect(() => {
        const target = new Date('August 23, 2026 09:30:00').getTime();
        const interval = setInterval(() => {
          const now = new Date().getTime();
          const dist = target - now;
          if (dist < 0) return;
          setTimeLeft({
            days: Math.floor(dist / (1000 * 60 * 60 * 24)),
            hours: Math.floor((dist % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)),
            minutes: Math.floor((dist % (1000 * 60 * 60)) / (1000 * 60)),
            seconds: Math.floor((dist % (1000 * 60)) / 1000)
          });
        }, 1000);
        return () => clearInterval(interval);
      }, []);

      const eventList = [
        { id: 'welcome', title: "Bachelor's Party", date: "Aug 20", time: "7:00 PM", venue: "Noci Andante, Chennai", note: "By Invite Only", icon: <Icons.Peacock className="w-6 h-6" /> },
        { id: 'nalungu', title: "Patti & Athai Nalungu", date: "Aug 21", time: "6:00 PM", venue: "To Be Announced", icon: <Icons.Elephant className="w-6 h-6" /> },
        { id: 'haldi', title: "Haldi & Mehndi", date: "Aug 22", time: "4:00 PM", venue: "Blue House, ECR, Chennai", icon: <Icons.Flower className="w-6 h-6" /> },
        { id: 'wedding', title: "Muhurtham", date: "Aug 23", time: "9:30 AM", venue: "The Leela Palace, Chennai", featured: true, icon: <Icons.Ganesh className="w-8 h-8" /> },
        { id: 'sangeet', title: "Sangeet & Cocktail", date: "Aug 24", time: "6:30 PM", venue: "Pullman, Chennai", icon: <Icons.Peacock className="w-6 h-6" /> }
      ];

      const handleRsvp = async (e) => {
        e.preventDefault();
        setIsSubmitting(true);
        try {
          // Rule: Always use the strict path for collections in this environment
          await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('rsvps').add({
            ...rsvpData, submittedAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          setIsSubmitted(true);
        } catch (err) {
          console.error(err);
          // Non-blocking user message instead of alert
          const msg = document.createElement('div');
          msg.innerHTML = "Submission error. Check your internet or configuration.";
          msg.className = "fixed top-10 left-1/2 -translate-x-1/2 bg-red-600 text-white px-6 py-3 rounded-full z-[1000]";
          document.body.appendChild(msg);
          setTimeout(() => msg.remove(), 3000);
        }
        setIsSubmitting(false);
      };

      return (
        <div className="min-h-screen pb-32 kolam-bg relative overflow-hidden">
          <div className="mango-leaf-toran" />

          {/* Siting Parrots on Toran */}
          <div className="absolute top-0 w-full flex justify-around px-10 pointer-events-none z-[52] opacity-60">
            <Icons.Parrot className="w-10 h-10 text-parakeet animate-sway" />
            <Icons.Parrot className="w-10 h-10 text-parakeet animate-sway scale-x-[-1]" />
            <Icons.Parrot className="w-10 h-10 text-parakeet animate-sway hidden md:block" />
          </div>

          {/* Swaying Temple Bells */}
          <div className="absolute top-10 left-0 w-full flex justify-around px-4 pointer-events-none z-[53]">
            <Icons.Bell className="w-6 h-6 text-gold animate-bell-swing" />
            <Icons.Bell className="w-6 h-6 text-gold animate-bell-swing hidden md:block" />
            <Icons.Bell className="w-6 h-6 text-gold animate-bell-swing" />
          </div>

          {/* Floating Decorative Elements */}
          <div className="fixed inset-0 pointer-events-none z-0">
            {[20, 40, 60, 80].map((l, i) => (
              <FloatingElement key={i} left={l} delay={i * 3} duration={12} color={i % 2 ? '#ff9800' : '#ffc107'}>
                <div className="w-2.5 h-2.5 rounded-full bg-current opacity-30 shadow-sm" />
              </FloatingElement>
            ))}
            {[5, 50, 85].map((l, i) => (
              <FloatingElement key={`p-${i}`} left={l} delay={i * 5 + 2} duration={18} color="#005f6b11">
                <Icons.Peacock className="w-10 h-10 transform -rotate-12" />
              </FloatingElement>
            ))}
          </div>

          <main className="relative z-10 max-w-4xl mx-auto px-6 pt-32 text-center">
            {activeTab === 'home' && (
              <div className="animate-in space-y-16">

                {/* Ganesh Idol Header */}
                <div className="flex flex-col items-center animate-float">
                  <div className="w-28 h-28 text-kumkum mb-4 drop-shadow-2xl">
                    <Icons.Ganesh className="w-full h-full" />
                  </div>
                  <p className="font-traditional text-kumkum tracking-[0.6em] text-[10px] font-bold uppercase">Om Shri Ganesha Namaha</p>
                </div>

                <div className="space-y-8">
                  <div className="relative inline-block">
                    <Icons.Elephant className="absolute -left-20 top-0 w-14 h-14 text-gold/20 animate-sway hidden md:block" />
                    <Icons.Elephant className="absolute -right-20 top-0 w-14 h-14 text-gold/20 animate-sway scale-x-[-1] hidden md:block" />
                    <h2 className="font-serif italic text-gray-500 text-lg md:text-xl">With the blessings of our elders & Almighty</h2>
                  </div>

                  <div className="py-6 relative">
                    <Icons.Parrot className="absolute -left-10 top-1/2 w-8 h-8 text-parakeet/20 animate-sway hidden lg:block" />
                    <Icons.Parrot className="absolute -right-10 top-1/2 w-8 h-8 text-parakeet/20 animate-sway scale-x-[-1] hidden lg:block" />

                    <h1 className="font-script text-8xl md:text-[10rem] text-kumkum leading-tight drop-shadow-md">Rishi</h1>
                    <div className="flex items-center justify-center gap-8 my-4">
                      <div className="h-0.5 w-20 bg-gradient-to-r from-transparent to-gold" />
                      <span className="font-traditional text-gold text-3xl lowercase tracking-widest italic font-medium">weds</span>
                      <div className="h-0.5 w-20 bg-gradient-to-l from-transparent to-gold" />
                    </div>
                    <h1 className="font-script text-8xl md:text-[10rem] text-kumkum leading-tight drop-shadow-md">Marilyn</h1>
                  </div>

                  <div className="bg-turmeric/10 border-y-2 border-gold/30 inline-block px-10 md:px-14 py-5 shadow-sm">
                    <p className="font-traditional text-xl md:text-3xl tracking-[0.5em] text-yellow-950 uppercase font-semibold">August 2026 • Chennai</p>
                  </div>
                </div>

                {/* Countdown */}
                <div className="relative max-w-md mx-auto">
                  <div className="grid grid-cols-4 gap-4 md:gap-6 bg-white/70 p-6 md:p-8 rounded-[2.5rem] border border-gold/40 backdrop-blur-md shadow-inner">
                    {Object.entries(timeLeft).map(([k, v]) => (
                      <div key={k} className="text-center">
                        <p className="text-3xl md:text-4xl font-serif text-kumkum leading-none">{v}</p>
                        <p className="text-[9px] uppercase tracking-widest text-gold font-bold mt-3">{k}</p>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Invitation Frame */}
                <div className="max-w-3xl mx-auto p-8 md:p-16 bg-white/95 shadow-2xl border-4 border-double border-gold/50 rounded-[3rem] md:rounded-[4rem] relative">
                  <div className="absolute -top-10 left-1/2 -translate-x-1/2 bg-silk p-4 rounded-full border-2 border-gold/30 shadow-xl">
                    <Icons.Flower className="text-kumkum w-10 h-10 animate-sway" />
                  </div>
                  <div className="space-y-8">
                    <p className="font-serif italic text-2xl md:text-4xl text-yellow-950 leading-relaxed px-2 md:px-8">
                      "While we wish we could hand-deliver this to you in person, please know that this invitation comes from the heart."
                    </p>
                    <div className="flex justify-center items-center gap-6">
                      <Icons.Peacock className="w-8 h-8 text-peacock opacity-40" />
                      <div className="h-px w-20 md:w-32 bg-gold/50" />
                      <Icons.Elephant className="w-8 h-8 text-gold opacity-30" />
                    </div>
                    <p className="text-gray-700 text-base md:text-lg leading-relaxed max-w-xl mx-auto italic font-serif">Your presence would truly honor us and add a special warmth to our wedding celebrations. We look forward to creating beautiful memories together in the presence of our loved ones.</p>
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'schedule' && (
              <div className="animate-in space-y-16">
                <div className="flex flex-col items-center">
                  <div className="flex gap-4 mb-2">
                    <Icons.Peacock className="w-12 h-12 text-peacock opacity-20" />
                    <Icons.Elephant className="w-12 h-12 text-gold opacity-20" />
                  </div>
                  <h2 className="font-traditional text-3xl md:text-4xl text-kumkum tracking-[0.4em] uppercase border-b-2 border-gold pb-4">The Sacred Itinerary</h2>
                </div>

                <div className="grid gap-10">
                  {eventList.map(e => (
                    <div key={e.id} className={`group p-8 md:p-10 rounded-[2.5rem] md:rounded-[3rem] border-2 text-left transition-all hover:scale-[1.03] ${e.featured ? 'border-kumkum bg-white shadow-[0_30px_60px_-15px_rgba(179,0,0,0.15)]' : 'border-gold/30 bg-white/90 backdrop-blur-sm shadow-xl'}`}>
                      <div className="flex flex-col md:flex-row justify-between items-center gap-6 md:gap-8">
                        <div className="flex items-center gap-6 md:gap-8 w-full md:w-auto">
                          <div className={`p-4 md:p-6 rounded-2xl md:rounded-3xl shadow-sm transition-transform group-hover:rotate-6 ${e.featured ? 'bg-kumkum text-white' : 'bg-gold/10 text-gold'}`}>
                            {e.icon}
                          </div>
                          <div>
                            <p className="text-[10px] font-bold text-gold uppercase tracking-[0.3em]">{e.date}</p>
                            <h3 className={`text-2xl md:text-3xl font-serif mt-1 ${e.featured ? 'text-kumkum' : 'text-gray-800'}`}>{e.title}</h3>
                            {e.note && <p className="text-[10px] text-peacock font-bold uppercase mt-1 tracking-[0.3em]">{e.note}</p>}
                          </div>
                        </div>
                        <div className="md:text-right bg-silk/80 p-5 md:p-6 rounded-3xl w-full md:w-64 shadow-inner">
                          <p className="flex items-center md:justify-end gap-3 text-sm md:text-base text-gray-500 font-semibold"><Icons.Clock size={16} className="text-gold" /> {e.time}</p>
                          <p className="flex items-center md:justify-end gap-3 text-sm md:text-base text-gray-700 mt-2"><Icons.MapPin size={16} className="text-gold" /> {e.venue}</p>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'rsvp' && (
              <div className="animate-in max-w-2xl mx-auto">
                {isSubmitted ? (
                  <div className="bg-white p-12 md:p-20 rounded-[3rem] md:rounded-[5rem] shadow-2xl text-center space-y-8 border-4 border-double border-gold/40">
                    <div className="w-24 h-24 md:w-32 md:h-32 bg-silk text-peacock rounded-full flex items-center justify-center mx-auto shadow-2xl border-2 border-gold/20">
                      <Icons.Check size={48} />
                    </div>
                    <h2 className="text-4xl md:text-5xl font-serif text-kumkum">Namaste & Gratitude</h2>
                    <p className="text-gray-700 font-serif italic text-xl md:text-2xl leading-relaxed px-4">Your response has been received. Your presence will make our union truly auspicious and joyous.</p>
                    <button onClick={() => setIsSubmitted(false)} className="text-gold font-bold uppercase tracking-widest text-xs border-b border-gold pb-1">Submit another response</button>
                  </div>
                ) : (
                  <form onSubmit={handleRsvp} className="bg-white/95 backdrop-blur-2xl p-8 md:p-16 rounded-[3rem] md:rounded-[4rem] shadow-[0_50px_100px_-20px_rgba(0,0,0,0.15)] border-t-[12px] border-kumkum space-y-10 md:space-y-12 text-left relative overflow-hidden">
                    <Icons.Elephant className="absolute -right-20 -bottom-20 w-64 h-64 opacity-[0.04] rotate-12 pointer-events-none" />
                    <Icons.Peacock className="absolute -left-16 -top-16 w-48 h-48 opacity-[0.04] rotate-45 pointer-events-none" />

                    <div className="text-center space-y-2">
                      <h2 className="text-5xl md:text-6xl font-serif text-kumkum">R.S.V.P</h2>
                      <p className="font-traditional text-gold text-xs tracking-[0.5em] uppercase font-bold italic">Grace our celebration</p>
                    </div>

                    <div className="space-y-8 md:space-y-10">
                      <div className="relative">
                        <label className="text-[10px] uppercase tracking-[0.4em] font-bold text-gold mb-3 block ml-4">Guest Full Name</label>
                        <input required className="w-full p-5 md:p-6 bg-silk/40 rounded-[2rem] md:rounded-[2.5rem] border-2 border-transparent focus:border-gold/50 focus:bg-white outline-none transition-all text-lg md:text-xl font-serif shadow-inner" value={rsvpData.name} onChange={e => setRsvpData({ ...rsvpData, name: e.target.value })} placeholder="How shall we address you?" />
                      </div>

                      <div className="grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-8">
                        <div>
                          <label className="text-[10px] uppercase tracking-[0.4em] font-bold text-gold mb-3 block ml-4">Total Attending</label>
                          <select className="w-full p-5 md:p-6 bg-silk/40 rounded-[2rem] md:rounded-[2.5rem] border-none outline-none font-bold text-gray-700 shadow-inner appearance-none text-center" value={rsvpData.guests} onChange={e => setRsvpData({ ...rsvpData, guests: e.target.value })}>
                            {[1, 2, 3, 4, 5, 6, 7, 8].map(n => <option key={n} value={n}>{n} {n === 1 ? 'Guest' : 'Guests'}</option>)}
                          </select>
                        </div>
                        <div>
                          <label className="text-[10px] uppercase tracking-[0.4em] font-bold text-gold mb-3 block ml-4">Contact Detail</label>
                          <input required className="w-full p-5 md:p-6 bg-silk/40 rounded-[2rem] md:rounded-[2.5rem] border-none outline-none shadow-inner" placeholder="Phone or Email" value={rsvpData.phone} onChange={e => setRsvpData({ ...rsvpData, phone: e.target.value })} />
                        </div>
                      </div>

                      <div className="space-y-5">
                        <label className="text-[10px] uppercase tracking-[0.4em] font-bold text-gold block ml-4">Ceremonies Joining</label>
                        <div className="grid grid-cols-1 gap-4">
                          {eventList.map(e => (
                            <label key={e.id} className={`flex items-center justify-between p-5 md:p-6 rounded-[1.5rem] md:rounded-[2rem] cursor-pointer transition-all border-2 ${rsvpData.events[e.id] ? 'bg-gold/5 border-gold shadow-md' : 'bg-gray-50/50 border-transparent opacity-60'}`}>
                              <div className="flex items-center gap-4">
                                <span className="opacity-40">{e.icon}</span>
                                <span className="text-sm md:text-base font-bold text-gray-800">{e.title}</span>
                              </div>
                              <input type="checkbox" checked={rsvpData.events[e.id]} onChange={() => setRsvpData({ ...rsvpData, events: { ...rsvpData.events, [e.id]: !rsvpData.events[e.id] } })} className="w-6 h-6 md:w-7 md:h-7 rounded-full accent-kumkum" />
                            </label>
                          ))}
                        </div>
                      </div>
                    </div>

                    <button type="submit" disabled={isSubmitting} className="w-full py-6 md:py-7 bg-kumkum text-white rounded-[2rem] md:rounded-[2.5rem] font-bold tracking-[0.4em] md:tracking-[0.5em] uppercase text-[10px] md:text-xs hover:bg-red-900 transition-all shadow-[0_20px_40px_-10px_rgba(179,0,0,0.3)] transform active:scale-[0.97] mt-4 flex justify-center items-center">
                      {isSubmitting ? <Icons.Loader size={24} /> : 'Send Blessings & RSVP'}
                    </button>
                  </form>
                )}
              </div>
            )}
          </main>

          {/* South Indian Animal Elements (Fixed Footer Decorations) */}
          <div className="fixed bottom-36 left-0 right-0 pointer-events-none flex justify-between px-10 md:px-16 opacity-[0.06] z-0">
            <Icons.Elephant className="w-32 h-32 md:w-40 md:h-40 transform -scale-x-100" />
            <Icons.Elephant className="w-32 h-32 md:w-40 md:h-40" />
          </div>

          <nav className="fixed bottom-6 md:bottom-10 left-1/2 -translate-x-1/2 glass-nav p-2 rounded-full shadow-[0_25px_60px_rgba(0,0,0,0.25)] z-[100] flex gap-2 md:gap-3 max-w-[90vw] overflow-x-auto no-scrollbar">
            {[
              { id: 'home', label: 'Home' },
              { id: 'schedule', label: 'Itinerary' },
              { id: 'rsvp', label: 'RSVP' }
            ].map(t => (
              <button key={t.id} onClick={() => { setActiveTab(t.id); window.scrollTo({ top: 0, behavior: 'smooth' }); }} className={`px-8 md:px-14 py-3 md:py-4 rounded-full text-[10px] md:text-[11px] font-bold uppercase tracking-[0.3em] md:tracking-[0.4em] transition-all duration-700 whitespace-nowrap ${activeTab === t.id ? 'bg-kumkum text-white shadow-lg scale-105' : 'text-gold hover:bg-gold/10'}`}>
                {t.label}
              </button>
            ))}
          </nav>

          <footer className="mt-28 py-20 text-center opacity-50 relative z-10 px-6">
            <div className="flex justify-center gap-6 md:gap-10 mb-6">
              <div className="h-px w-16 md:w-20 bg-gold mt-5" />
              <Icons.Ganesh className="w-10 h-10 text-kumkum" />
              <div className="h-px w-16 md:w-20 bg-gold mt-5" />
            </div>
            <p className="font-traditional text-[10px] md:text-xs tracking-[0.5em] text-gold uppercase font-bold">Rishi & Marilyn • Two Souls, One Journey</p>
            <p className="font-serif italic text-gray-500 mt-4 text-sm">Chennai, 2026</p>
          </footer>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>

</html>
