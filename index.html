<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rishi & Marilyn • Sacred Union</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            maroon: '#800000',
            royalGold: '#D4AF37',
            peacockTeal: '#006A6A', // Deep refined teal
            ivory: '#FFFFF0',
            sand: '#F5F5DC',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['Playfair Display', 'serif'],
            heading: ['Cinzel', 'serif'],
            script: ['Great Vibes', 'cursive'],
          },
          animation: {
            'spin-slow': 'spin 60s linear infinite',
            'float': 'float 6s ease-in-out infinite',
            'fade-in': 'fadeIn 1.5s ease-out forwards',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-10px)' },
            },
            fadeIn: {
              '0%': { opacity: '0', transform: 'translateY(20px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            }
          }
        }
      }
    }
  </script>

  <!-- React & ReactDOM (UMD) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Firebase (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Google Fonts -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Great+Vibes&family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap');

    body {
      background-color: #FFFFF0;
      color: #333;
    }

    .glass-panel {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(212, 175, 55, 0.3);
    }

    .gold-gradient-text {
      background: linear-gradient(to right, #B8860B, #D4AF37, #B8860B);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>

<body class="overflow-x-hidden selection:bg-maroon/20">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- SVGs & Icons ---
    const Icons = {
      // Elegant Peacock Motif
      Peacock: (props) => (
        <svg {...props} viewBox="0 0 100 100" fill="currentColor">
          <path d="M50 20c-5-5-12-8-20-8-18 0-32 12-32 28 0 10 4 18 10 22-2 4-4 8-4 12 0 12 10 22 22 22s22-10 22-22c0-4-2-8-4-12 6-4 10-12 10-22 0-16-14-28-32-28zm0 28c0 10-8 18-18 18s-18-8-18-18 8-18 18-18 18 8 18 18z" opacity="0.9" />
          <path d="M50 20C60 10 70 10 80 20C90 30 90 40 80 50C70 60 60 60 50 50" fill="none" stroke="currentColor" strokeWidth="1" opacity="0.5" />
        </svg>
      ),
      // Royal Elephant
      Elephant: (props) => (
        <svg {...props} viewBox="0 0 100 100" fill="currentColor">
          <path d="M80 50c-2-10-10-20-30-20-20 0-30 15-35 30-5-5-15-5-20-5-5 0-10 5-10 10 0 15 15 25 25 35 15-5 25-10 35-10 10 0 20 5 25 15 5-5 10-10 10-20 0-15-5-25-15-35z" opacity="0.9" />
        </svg>
      ),
      // Graceful Swan
      Swan: (props) => (
        <svg {...props} viewBox="0 0 100 100" fill="currentColor">
          <path d="M70 30c-5-10-15-15-25-15-15 0-25 10-30 25-5 15 0 25 10 30 5 2 10 2 15 0 10-5 20-5 30 0 5 2 10 5 10 10 0 5-5 10-10 10H30c-10 0-20-5-25-15-5-10 0-25 10-35 10-10 25-15 40-15 10 0 15 5 15 15z" opacity="0.9" />
        </svg>
      ),
      Ganesh: (props) => (
        <svg {...props} viewBox="0 0 100 100" fill="currentColor">
          <path d="M50 10c-15 0-25 12-25 25 0 10 5 18 12 22-4 4-7 10-7 15 0 12 10 20 20 20s20-8 20-20c0-5-3-11-7-15 7-4 12-12 12-22 0-13-10-25-25-25zm0 5c12 0 20 10 20 20s-8 20-20 20-20-10-20-20 8-20 20-20zm-10 45c0-6 4-10 10-10s10 4 10 10-4 10-10 10-10-4-10-10z" opacity="0.9" />
        </svg>
      ),
      Ornament: (props) => (
        <svg {...props} viewBox="0 0 100 20" fill="none" stroke="currentColor">
          <path d="M0 10 Q 25 0, 50 10 T 100 10" strokeWidth="1" />
        </svg>
      ),
      MapPin: (props) => <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 1 1 16 0Z" /><circle cx="12" cy="10" r="3" /></svg>,
      Clock: (props) => <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" /></svg>,
      Calendar: (props) => <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect width="18" height="18" x="3" y="4" rx="2" ry="2" /><line x1="16" x2="16" y1="2" y2="6" /><line x1="8" x2="8" y1="2" y2="6" /><line x1="3" x2="21" y1="10" y2="10" /></svg>,
      Check: (props) => <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="20 6 9 17 4 12" /></svg>,
      Loader: (props) => <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="animate-spin"><path d="M21 12a9 9 0 1 1-6.219-8.56" /></svg>
    };

    // --- CONFIG ---
    const firebaseConfig = {
      apiKey: "AIzaSyAmqq8gwFTvpFH3rVfL43xurnbU7tWh0h4",
      authDomain: "kumaranwedding-b59d6.firebaseapp.com",
      projectId: "kumaranwedding-b59d6",
      storageBucket: "kumaranwedding-b59d6.firebasestorage.app",
      messagingSenderId: "281972038441",
      appId: "1:281972038441:web:a46195c908003dd59b3538",
      measurementId: "G-XKS7R1C63C"
    };

    // Initialize
    const finalConfig = typeof window.__firebase_config !== 'undefined' ? JSON.parse(window.__firebase_config) : firebaseConfig;
    if (!firebase.apps.length) firebase.initializeApp(finalConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
    const appId = typeof window.__app_id !== 'undefined' ? window.__app_id : 'wedding-rishi-marilyn';

    // --- MAIN ---
    const App = () => {
      const [activeTab, setActiveTab] = useState('home');
      const [timeLeft, setTimeLeft] = useState({ days: 0, hours: 0, minutes: 0, seconds: 0 });
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [isSubmitted, setIsSubmitted] = useState(false);
      const [rsvpData, setRsvpData] = useState({
        name: '', phone: '', guests: 1, message: '',
        events: { welcome: true, nalungu: true, haldi: true, wedding: true, sangeet: true }
      });

      // Countdown
      useEffect(() => {
        const target = new Date('August 23, 2026 09:30:00').getTime();
        const interval = setInterval(() => {
          const now = new Date().getTime();
          const dist = target - now;
          if (dist < 0) return;
          setTimeLeft({
            days: Math.floor(dist / (1000 * 60 * 60 * 24)),
            hours: Math.floor((dist % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)),
            minutes: Math.floor((dist % (1000 * 60 * 60)) / (1000 * 60)),
            seconds: Math.floor((dist % (1000 * 60)) / 1000)
          });
        }, 1000);
        return () => clearInterval(interval);
      }, []);

      const handleRsvp = async (e) => {
        e.preventDefault();
        setIsSubmitting(true);
        try {
          await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('rsvps').add({
            ...rsvpData, submittedAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          setIsSubmitted(true);
        } catch (err) {
          console.error(err);
          alert("Submission failed. Please check connection.");
        }
        setIsSubmitting(false);
      };

      const events = [
        { id: 'welcome', title: "Welcome & Bachelor Party", date: "Aug 20, 2026", time: "7:00 PM", venue: "Noci Adante, Chennai", note: "Dress to impress" },
        { id: 'nalungu', title: "Patti & Athai Nalungu", date: "Aug 21, 2026", time: "6:00 PM", venue: "To Be Announced", note: "Traditional Ceremony" },
        { id: 'haldi', title: "Haldi & Mehndi", date: "Aug 22, 2026", time: "4:00 PM", venue: "Blue House, ECR, Chennai", note: "Saffron Celebration" },
        { id: 'wedding', title: "Muhurtham", date: "Aug 23, 2026", time: "9:30 AM", venue: "The Leela Palace, Chennai", note: "Auspicious Vows", featured: true },
        { id: 'sangeet', title: "Sangeet & Cocktail", date: "Aug 24, 2026", time: "6:30 PM", venue: "Pullman, Chennai", note: "Dance & Celebration" }
      ];

      return (
        <div className="min-h-screen bg-ivory font-sans text-gray-800 relative">

          {/* Top Border with Motifs */}
          <div className="fixed top-0 left-0 w-full h-2 bg-maroon z-50" />
          <div className="fixed top-2 left-0 w-full h-16 flex justify-between items-start px-4 z-40 pointer-events-none opacity-20">
            <Icons.Peacock className="w-24 h-24 text-peacockTeal transform -scale-x-100" />
            <Icons.Peacock className="w-24 h-24 text-peacockTeal" />
          </div>

          {/* Main Content Area */}
          <main className="max-w-4xl mx-auto px-6 py-20 pb-32">

            {activeTab === 'home' && (
              <div className="animate-fade-in space-y-12 text-center">

                {/* Ganesh & Title */}
                <div className="flex flex-col items-center gap-4">
                  <Icons.Ganesh className="w-20 h-20 text-maroon animate-float" />
                  <p className="font-heading text-maroon tracking-[0.3em] text-xs uppercase font-bold">Shree Ganeshay Namah</p>
                </div>

                {/* Couple Name */}
                <div className="space-y-6 relative py-10">
                  <div className="absolute top-0 left-1/2 -translate-x-1/2 w-3/4 h-full border-y border-royalGold/20 scale-y-100" />
                  <h1 className="font-script text-6xl md:text-8xl text-maroon drop-shadow-sm">Rishi</h1>
                  <div className="flex items-center justify-center gap-4">
                    <Icons.Ornament className="w-24 text-royalGold" />
                    <span className="font-serif italic text-2xl text-royalGold">&</span>
                    <Icons.Ornament className="w-24 text-royalGold transform rotate-180" />
                  </div>
                  <h1 className="font-script text-6xl md:text-8xl text-maroon drop-shadow-sm">Marilyn</h1>
                </div>

                {/* Date Grid */}
                <div className="inline-block bg-white p-6 border border-royalGold/30 shadow-lg relative">
                  <Icons.Swan className="absolute -top-6 -left-6 w-12 h-12 text-royalGold opacity-60" />
                  <Icons.Swan className="absolute -bottom-6 -right-6 w-12 h-12 text-royalGold opacity-60 transform scale-x-[-1]" />
                  <p className="font-heading text-xl md:text-2xl text-peacockTeal tracking-widest uppercase mb-2">August 20, 2026- August 24, 2026</p>
                  <p className="font-serif italic text-gray-500">Chennai, Tamil Nadu</p>
                </div>

                {/* Countdown */}
                <div className="grid grid-cols-4 gap-4 max-w-lg mx-auto border-t border-b border-maroon/10 py-8">
                  {Object.entries(timeLeft).map(([k, v]) => (
                    <div key={k} className="flex flex-col items-center">
                      <span className="text-3xl font-serif text-maroon">{v}</span>
                      <span className="text-[10px] uppercase tracking-widest text-peacockTeal font-bold mt-1">{k}</span>
                    </div>
                  ))}
                </div>

                {/* Invitation Text */}
                <div className="max-w-2xl mx-auto space-y-6 text-lg font-serif leading-relaxed text-gray-700">
                  <p>"We cordially invite you to celebrate the union of our hearts and families."</p>
                  <div className="h-px w-20 bg-royalGold mx-auto opacity-50" />
                  <p className="italic text-base">Your presence is the most precious gift we could ask for on this auspicious occasion.</p>
                </div>
              </div>
            )}

            {activeTab === 'schedule' && (
              <div className="animate-fade-in space-y-10">
                <div className="text-center space-y-4 mb-12">
                  <Icons.Elephant className="w-16 h-16 text-maroon mx-auto opacity-80" />
                  <h2 className="font-heading text-3xl text-maroon uppercase tracking-widest">Wedding Itinerary</h2>
                  <div className="w-24 h-1 bg-royalGold mx-auto" />
                </div>

                <div className="grid gap-6">
                  {events.map((e, idx) => (
                    <div key={e.id} className={`flex flex-col md:flex-row items-center gap-6 p-8 border ${e.featured ? 'border-maroon bg-white shadow-xl scale-[1.02]' : 'border-royalGold/30 bg-white/60'} relative overflow-hidden transition-all duration-300 hover:shadow-lg`}>
                      {e.featured && <div className="absolute top-0 right-0 bg-maroon text-white text-[10px] uppercase font-bold px-3 py-1 tracking-widest">Main Ceremony</div>}

                      <div className="text-center md:text-left min-w-[140px]">
                        <p className="font-heading text-4xl text-peacockTeal">{e.date.split(',')[0].split(' ')[1]}</p>
                        <p className="font-serif italic text-gray-500">{e.date.split(',')[0].split(' ')[0]}</p>
                      </div>

                      <div className="h-px w-full md:h-16 md:w-px bg-gray-200" />

                      <div className="flex-1 text-center md:text-left space-y-2">
                        <h3 className="font-heading text-xl text-maroon">{e.title}</h3>
                        <p className="font-bold text-xs uppercase tracking-[0.2em] text-royalGold">{e.note}</p>
                        <div className="flex flex-col md:flex-row gap-4 text-sm text-gray-600 mt-2">
                          <span className="flex items-center gap-2 justify-center md:justify-start"><Icons.Clock size={14} className="text-peacockTeal" /> {e.time}</span>
                          <span className="flex items-center gap-2 justify-center md:justify-start"><Icons.MapPin size={14} className="text-peacockTeal" /> {e.venue}</span>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'rsvp' && (
              <div className="animate-fade-in max-w-2xl mx-auto">
                {isSubmitted ? (
                  <div className="bg-white p-12 text-center border-double border-4 border-maroon shadow-2xl space-y-6">
                    <Icons.Peacock className="w-20 h-20 text-peacockTeal mx-auto" />
                    <h2 className="font-heading text-3xl text-maroon">Thank You</h2>
                    <p className="font-serif text-gray-600 italic">We are honored by your response and look forward to celebrating with you.</p>
                    <button onClick={() => setIsSubmitted(false)} className="text-xs uppercase tracking-widest text-royalGold font-bold border-b border-royalGold pb-0.5 hover:text-maroon transition-colors">Submit Another</button>
                  </div>
                ) : (
                  <div className="bg-white p-8 md:p-12 shadow-2xl border-t-8 border-maroon relative">
                    <Icons.Swan className="absolute top-4 right-4 w-12 h-12 text-royalGold opacity-20" />
                    <div className="text-center mb-10">
                      <h2 className="font-heading text-3xl text-maroon mb-2">RSVP</h2>
                      <p className="font-serif italic text-gray-500">Kindly respond by June 15, 2026</p>
                    </div>

                    <form onSubmit={handleRsvp} className="space-y-8">
                      <div className="space-y-2">
                        <label className="font-heading text-xs uppercase font-bold text-peacockTeal block">Guest Name</label>
                        <input required className="w-full border-b-2 border-gray-200 focus:border-maroon outline-none py-2 font-serif text-lg bg-transparent transition-colors"
                          value={rsvpData.name} onChange={e => setRsvpData({ ...rsvpData, name: e.target.value })} placeholder="Enter full name" />
                      </div>

                      <div className="grid grid-cols-2 gap-8">
                        <div className="space-y-2">
                          <label className="font-heading text-xs uppercase font-bold text-peacockTeal block">Attending</label>
                          <select className="w-full border-b-2 border-gray-200 focus:border-maroon outline-none py-2 font-serif bg-transparent"
                            value={rsvpData.guests} onChange={e => setRsvpData({ ...rsvpData, guests: parseInt(e.target.value) })}>
                            {[1, 2, 3, 4, 5, 6].map(n => <option key={n} value={n}>{n} Guests</option>)}
                          </select>
                        </div>
                        <div className="space-y-2">
                          <label className="font-heading text-xs uppercase font-bold text-peacockTeal block">Mobile</label>
                          <input required className="w-full border-b-2 border-gray-200 focus:border-maroon outline-none py-2 font-serif bg-transparent"
                            value={rsvpData.phone} onChange={e => setRsvpData({ ...rsvpData, phone: e.target.value })} placeholder="Phone number" />
                        </div>
                      </div>

                      <div className="space-y-4 pt-4">
                        <label className="font-heading text-xs uppercase font-bold text-peacockTeal block">Ceremonies</label>
                        <div className="grid gap-3">
                          {events.map(e => (
                            <label key={e.id} className={`flex items-center justify-between p-4 border transition-all cursor-pointer hover:bg-gray-50 ${rsvpData.events[e.id] ? 'border-maroon bg-maroon/5' : 'border-gray-200'}`}>
                              <span className={`font-serif text-sm ${rsvpData.events[e.id] ? 'text-maroon font-bold' : 'text-gray-600'}`}>{e.title}</span>
                              <input type="checkbox" checked={rsvpData.events[e.id]} onChange={() => setRsvpData({ ...rsvpData, events: { ...rsvpData.events, [e.id]: !rsvpData.events[e.id] } })} className="w-5 h-5 accent-maroon" />
                            </label>
                          ))}
                        </div>
                      </div>

                      <button type="submit" disabled={isSubmitting} className="w-full bg-maroon text-white py-4 font-heading uppercase tracking-[0.2em] text-xs hover:bg-peacockTeal transition-colors shadow-lg disabled:opacity-50 mt-6">
                        {isSubmitting ? 'Sending...' : 'Confirm Attendance'}
                      </button>
                    </form>
                  </div>
                )}
              </div>
            )}

          </main>

          {/* Navigation Bar */}
          <nav className="fixed bottom-8 left-1/2 -translate-x-1/2 glass-panel px-6 py-3 rounded-full shadow-2xl z-50 flex gap-4">
            {['home', 'schedule', 'rsvp'].map(tab => (
              <button key={tab} onClick={() => { setActiveTab(tab); window.scrollTo({ top: 0, behavior: 'smooth' }); }}
                className={`uppercase text-[10px] font-bold tracking-[0.2em] px-4 py-2 rounded-full transition-all ${activeTab === tab ? 'bg-maroon text-white' : 'text-gray-500 hover:text-maroon'}`}>
                {tab}
              </button>
            ))}
          </nav>

          <div className="fixed bottom-0 left-0 w-full h-2 bg-peacockTeal z-50" />
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>

</html>
