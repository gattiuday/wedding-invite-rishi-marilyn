<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rishi & Marilyn • The Wedding</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg: '#F8F5F2',
            accent: '#9E7E44',
            textPrimary: '#333333',
            textSecondary: '#666666',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['Playfair Display', 'serif'],
          },
          animation: {
            'spin-slow': 'spin 60s linear infinite',
          }
        }
      }
    }
  </script>

  <!-- React & ReactDOM (UMD) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Firebase (Compat/Namespace) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap');

    body {
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      background-color: #F8F5F2;
    }
  </style>
</head>

<body class="bg-[#F8F5F2] text-[#333333]">
  <div id="root"></div>

  <script type="text/babel">
    // --- ICONS (Inline SVGs to replace Lucide-React dependency) ---
    const Icon = ({ path, className, strokeWidth = 2, size = 24 }) => (
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width={size} height={size}
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        strokeWidth={strokeWidth}
        strokeLinecap="round"
        strokeLinejoin="round"
        className={className}
      >
        {path}
      </svg>
    );

    const Icons = {
      Music: (props) => <Icon {...props} path={<><path d="M9 18V5l12-2v13" /><circle cx="6" cy="18" r="3" /><circle cx="18" cy="16" r="3" /></>} />,
      Flower2: (props) => <Icon {...props} path={<><path d="M12 5a3 3 0 1 1 3 3m-3-3a3 3 0 1 0-3 3m3-3v18m0-13a3 3 0 1 1 3 3m-3-3a3 3 0 1 0-3 3m3 8a3 3 0 1 1 3 3m-3-3a3 3 0 1 0-3 3" /></>} />,
      GlassWater: (props) => <Icon {...props} path={<><path d="M15.2 22a3 3 0 0 0-2.2-5" /><path d="M9 22a3 3 0 0 1 2.2-5" /><path d="M2 7a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2h-6.1a2 2 0 0 0-1.8.9l-2.7 5.4a2 2 0 0 1-1.8.9H5a2 2 0 0 1-2-2z" /></>} />,
      Calendar: (props) => <Icon {...props} path={<><rect width="18" height="18" x="3" y="4" rx="2" ry="2" /><line x1="16" x2="16" y1="2" y2="6" /><line x1="8" x2="8" y1="2" y2="6" /><line x1="3" x2="21" y1="10" y2="10" /></>} />,
      Clock: (props) => <Icon {...props} path={<><circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" /></>} />,
      MapPin: (props) => <Icon {...props} path={<><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" /><circle cx="12" cy="10" r="3" /></>} />,
      ExternalLink: (props) => <Icon {...props} path={<><path d="M15 3h6v6" /><path d="M10 14 21 3" /><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" /></>} />,
      Sparkles: (props) => <Icon {...props} path={<><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z" /></>} />,
      ChevronRight: (props) => <Icon {...props} path={<path d="m9 18 6-6-6-6" />} />,
      ShieldCheck: (props) => <Icon {...props} path={<><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10" /><path d="m9 12 2 2 4-4" /></>} />,
      Phone: (props) => <Icon {...props} path={<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" />} />,
      Users: (props) => <Icon {...props} path={<><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /><path d="M22 21v-2a4 4 0 0 0-3-3.87" /><path d="M16 3.13a4 4 0 0 1 0 7.75" /></>} />,
      Plus: (props) => <Icon {...props} path={<><path d="M5 12h14" /><path d="M12 5v14" /></>} />,
      Minus: (props) => <Icon {...props} path={<path d="M5 12h14" />} />,
      Check: (props) => <Icon {...props} path={<path d="M20 6 9 17l-5-5" />} />,
      Loader2: (props) => <Icon {...props} path={<path d="M21 12a9 9 0 1 1-6.219-8.56" />} className={props.className + " animate-spin"} />,
    };


    // --- FIREBASE CONFIG ---
    // Replace "YOUR_..." with your actual config from console.firebase.google.com
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "123456",
      appId: "1:123456:web:123456"
    };

    // Use Global Compat Namespace
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const appId = 'wedding-rishi-marilyn-royal-v4';

    const { useState, useEffect } = React;

    const App = () => {
      const [activeTab, setActiveTab] = useState('home');
      const [user, setUser] = useState(null);
      const [timeLeft, setTimeLeft] = useState({ days: 0, hours: 0, minutes: 0, seconds: 0 });
      const [showAdminPanel, setShowAdminPanel] = useState(false);
      const [adminPassword, setAdminPassword] = useState('');
      const [allRsvps, setAllRsvps] = useState([]);
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [isSubmitted, setIsSubmitted] = useState(false);

      // RSVP Form State
      const [rsvpData, setRsvpData] = useState({
        name: '',
        phone: '',
        guests: 1,
        events: { haldi: true, wedding: true, reception: true },
        message: ''
      });

      // Auth Logic
      useEffect(() => {
        const initAuth = async () => {
          try {
            await auth.signInAnonymously();
          } catch (e) {
            console.warn("Auth failed (likely placeholder config). Using mock user.");
            setUser({ uid: 'guest-preview', isAnonymous: true });
          }
        };
        initAuth();
        const unsubscribe = auth.onAuthStateChanged(setUser);
        return () => unsubscribe();
      }, []);

      // Admin Data Fetching
      useEffect(() => {
        if (!user || !showAdminPanel) return;
        try {
          const rsvpsRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('rsvps');
          const unsubscribe = rsvpsRef.onSnapshot((snapshot) => {
            const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            setAllRsvps(data);
          }, (err) => console.warn("Firestore error:", err));
          return () => unsubscribe();
        } catch (e) { console.warn("Firestore init error:", e); }
      }, [user, showAdminPanel]);

      // Countdown Logic
      useEffect(() => {
        const targetDate = new Date('August 22, 2026 16:00:00').getTime();
        const timer = setInterval(() => {
          const now = new Date().getTime();
          const distance = targetDate - now;
          setTimeLeft({
            days: Math.floor(distance / (1000 * 60 * 60 * 24)),
            hours: Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)),
            minutes: Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60)),
            seconds: Math.floor((distance % (1000 * 60)) / 1000),
          });
        }, 1000);
        return () => clearInterval(timer);
      }, []);

      const handleExplore = () => setActiveTab('schedule');

      const events = [
        {
          id: 'haldi',
          title: 'Haldi & Mehandi',
          subtitle: 'The Saffron Celebration',
          date: 'August 22, 2026',
          time: '4:00 PM — 10:00 PM',
          venue: 'Blue House, Chennai',
          mapUrl: 'https://www.google.com/maps/search/?api=1&query=Blue+House+Chennai',
          icon: <Icons.Music className="text-[#9E7E44]" />,
          theme: 'Traditional Silk'
        },
        {
          id: 'wedding',
          title: 'Wedding Ceremony',
          subtitle: 'The Auspicious Vows',
          date: 'August 23, 2026',
          time: '9:30 AM — 2:00 PM',
          venue: 'The Leela Palace, Chennai',
          mapUrl: 'https://www.google.com/maps/search/?api=1&query=The+Leela+Palace+Chennai',
          icon: <Icons.Flower2 className="text-[#9E7E44]" />,
          theme: 'Royal Heritage'
        },
        {
          id: 'reception',
          title: 'Sangeet & Cocktail',
          subtitle: 'Dance, Drinks & Celebration',
          date: 'August 24, 2026',
          time: '6:00 PM — 12:00 AM',
          venue: 'Pullman, Chennai',
          mapUrl: 'https://www.google.com/maps/search/?api=1&query=Pullman+Hotel+Chennai',
          icon: <Icons.GlassWater className="text-[#9E7E44]" />,
          theme: 'Starlit Evening'
        }
      ];

      const handleSubmitRsvp = async (e) => {
        e.preventDefault();
        if (!user || !rsvpData.name) return;
        setIsSubmitting(true);
        try {
          const rsvpsRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('rsvps');
          await rsvpsRef.add({ ...rsvpData, submittedAt: firebase.firestore.FieldValue.serverTimestamp(), uid: user.uid });
          setIsSubmitted(true);
        } catch (err) {
          console.error(err);
          setTimeout(() => { setIsSubmitted(true); setIsSubmitting(false); }, 1000);
        } finally { setIsSubmitting(false); }
      };

      const adjustGuests = (amount) => setRsvpData(prev => ({ ...prev, guests: Math.max(1, prev.guests + amount) }));

      const CoupleLogo = ({ className }) => (
        <div className={`relative flex items-center justify-center ${className}`}>
          <svg viewBox="0 0 100 100" className="absolute w-full h-full text-[#9E7E44] opacity-30 animate-spin-slow">
            <path fill="none" stroke="currentColor" strokeWidth="0.3" d="M50 2 L52 48 L98 50 L52 52 L50 98 L48 52 L2 50 L48 48 Z" />
            <circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" strokeWidth="0.2" strokeDasharray="2 4" />
          </svg>
          <div className="relative z-10 flex flex-col items-center justify-center bg-white/40 backdrop-blur-md rounded-full w-[85%] h-[85%] border border-[#9E7E44]/10 shadow-sm">
            <span className="font-serif text-[#9E7E44] text-4xl md:text-5xl tracking-tighter leading-none select-none">
              R<span className="text-xl mx-[-3px] opacity-60 italic">&</span>M
            </span>
            <div className="h-[0.5px] w-10 bg-[#9E7E44]/30 my-1.5" />
            <span className="text-[8px] uppercase tracking-[0.5em] text-[#9E7E44]/60 font-bold">MMXXVI</span>
          </div>
        </div>
      );

      const MandalaDivider = ({ className }) => (
        <svg viewBox="0 0 100 20" className={className}>
          <path fill="none" stroke="currentColor" strokeWidth="0.3" d="M0 10 L42 10 M58 10 L100 10" />
          <circle cx="50" cy="10" r="2.5" fill="none" stroke="currentColor" strokeWidth="0.5" />
          <circle cx="50" cy="10" r="5" fill="none" stroke="currentColor" strokeWidth="0.2" strokeDasharray="1 1" />
        </svg>
      );

      const renderContent = () => {
        if (activeTab === 'admin') {
          if (adminPassword !== 'rishi2026') {
            return (
              <div className="animate-in fade-in max-w-sm mx-auto bg-white/40 backdrop-blur-md p-10 rounded-[2.5rem] border border-[#9E7E44]/20 shadow-2xl space-y-6">
                <div className="text-center">
                  <Icons.ShieldCheck className="mx-auto text-[#9E7E44] mb-3" size={32} strokeWidth={1} />
                  <h2 className="text-xl font-serif text-[#333333] tracking-wide uppercase">Host Access</h2>
                </div>
                <input
                  type="password" autoFocus
                  className="w-full p-4 bg-white/50 rounded-2xl border-none outline-none text-center text-xl tracking-widest placeholder:text-slate-300 shadow-inner"
                  placeholder="••••"
                  onChange={(e) => setAdminPassword(e.target.value)}
                />
              </div>
            );
          }
          const totalGuests = allRsvps.reduce((acc, curr) => acc + (curr.guests || 0), 0);
          return (
            <div className="animate-in slide-in-from-bottom duration-500 space-y-6 pb-24 text-left">
              <div className="bg-white/80 backdrop-blur-md rounded-[3rem] border border-[#9E7E44]/10 shadow-xl p-8 text-center">
                <h3 className="font-serif text-2xl text-[#333333] mb-6">Attendance Overview</h3>
                <div className="grid grid-cols-2 gap-4">
                  <div className="bg-[#F8F5F2] p-6 rounded-3xl border border-[#9E7E44]/5">
                    <p className="text-[10px] uppercase tracking-widest text-[#9E7E44] font-bold">Total Souls</p>
                    <p className="text-4xl font-serif text-[#333333] mt-2">{totalGuests}</p>
                  </div>
                  <div className="bg-[#F8F5F2] p-6 rounded-3xl border border-[#9E7E44]/5">
                    <p className="text-[10px] uppercase tracking-widest text-[#9E7E44] font-bold">Entries</p>
                    <p className="text-4xl font-serif text-[#333333] mt-2">{allRsvps.length}</p>
                  </div>
                </div>
              </div>
              <div className="bg-white/80 rounded-[3rem] p-4 shadow-xl divide-y divide-slate-100 overflow-hidden">
                {allRsvps.map(r => (
                  <div key={r.id} className="p-6 transition-colors hover:bg-white/40">
                    <div className="flex justify-between items-start">
                      <div>
                        <h4 className="font-bold text-lg text-[#333333]">{r.name}</h4>
                        {r.phone && (
                          <div className="flex items-center gap-1.5 text-xs text-slate-400 mt-1 font-medium">
                            <Icons.Phone size={10} />
                            <span>{r.phone}</span>
                          </div>
                        )}
                      </div>
                      <span className="text-[#9E7E44] font-serif italic text-sm">{r.guests} guests</span>
                    </div>
                    {r.message && <p className="text-sm text-slate-500 mt-3 font-serif italic leading-relaxed">"{r.message}"</p>}
                  </div>
                ))}
              </div>
            </div>
          );
        }

        switch (activeTab) {
          case 'home':
            return (
              <div className="animate-in fade-in duration-1000 text-center space-y-12 py-10 relative">
                <div className="space-y-12">
                  <div className="space-y-6">
                    <div className="flex justify-center items-center gap-8 mb-6">
                      <div className="h-[0.5px] w-16 bg-gradient-to-r from-transparent to-[#9E7E44]/30" />
                      <Icons.Sparkles className="text-[#9E7E44] opacity-30 animate-pulse" size={24} />
                      <div className="h-[0.5px] w-16 bg-gradient-to-l from-transparent to-[#9E7E44]/30" />
                    </div>

                    <span className="text-[12px] uppercase tracking-[0.6em] text-[#9E7E44] font-semibold block">The Auspicious Union</span>
                    <h1 className="text-8xl md:text-9xl font-serif text-[#333333] leading-none tracking-tighter">
                      Rishi <br />
                      <span className="italic text-[#9E7E44] font-normal text-6xl md:text-8xl">&</span> <br />
                      Marilyn
                    </h1>

                    <div className="max-w-md mx-auto pt-10 space-y-6">
                      <MandalaDivider className="w-40 mx-auto text-[#9E7E44]/20" />
                      <p className="text-[#555555] font-serif italic text-xl md:text-2xl leading-relaxed px-10 opacity-90">
                        "In the sacred presence of our elders and loved ones, we embark on a journey of a thousand years. An auspicious union blessed by tradition and bound by grace."
                      </p>
                    </div>

                    <div className="pt-12 space-y-4">
                      <p className="text-[#9E7E44] font-serif italic text-3xl tracking-widest font-medium">August 22nd — 24th</p>
                      <p className="text-[11px] uppercase tracking-[0.5em] text-[#888888] font-bold">Chennai • Tamil Nadu</p>
                    </div>
                  </div>
                </div>

                <div className="relative inline-block pt-6">
                  <div className="bg-white/60 backdrop-blur-lg border border-white/80 p-12 rounded-[4rem] shadow-[0_20px_50px_rgba(158,126,68,0.08)] space-y-10 relative">
                    <div className="flex justify-center gap-12">
                      {Object.entries(timeLeft).map(([unit, value]) => (
                        <div key={unit} className="flex flex-col">
                          <span className="text-5xl md:text-6xl font-serif text-[#333333]">{value < 0 ? 0 : value}</span>
                          <span className="text-[9px] uppercase tracking-[0.4em] text-[#9E7E44] font-bold mt-3">{unit}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>

                <div className="pt-12">
                  <button
                    onClick={handleExplore}
                    className="group relative px-20 py-6 overflow-hidden rounded-full transition-all shadow-xl active:scale-95 border border-[#9E7E44]/20 hover:border-[#9E7E44]/40"
                  >
                    <div className="absolute inset-0 bg-[#333333] group-hover:bg-[#9E7E44] transition-colors duration-700" />
                    <span className="relative text-[11px] font-bold tracking-[0.6em] uppercase text-white flex items-center gap-4">
                      View Itinerary <Icons.ChevronRight size={16} />
                    </span>
                  </button>
                </div>
              </div>
            );
          case 'schedule':
            return (
              <div className="animate-in slide-in-from-bottom-8 duration-700 space-y-12 pb-24 text-center">
                <div className="pt-6 flex flex-col items-center">
                  <CoupleLogo className="w-32 h-32 md:w-44 md:h-44 mb-10" />
                  <h2 className="text-6xl font-serif text-[#333333] tracking-tight">The Ceremonies</h2>
                  <p className="text-[10px] uppercase tracking-[0.6em] text-[#9E7E44] mt-4 font-bold">Sacred Journey Details</p>
                </div>

                <div className="grid grid-cols-1 gap-12 mt-12">
                  {events.map((event) => (
                    <div key={event.id} className="group relative bg-white/80 backdrop-blur-xl p-12 rounded-[4rem] border border-white/80 shadow-sm hover:shadow-2xl transition-all duration-700 hover:-translate-y-2">
                      <div className="flex flex-col md:flex-row gap-12 items-center md:items-start text-center md:text-left">
                        <div className="w-24 h-24 bg-[#F8F5F2] rounded-[3rem] flex items-center justify-center border border-[#9E7E44]/10 shadow-inner group-hover:scale-105 transition-transform duration-700">
                          {React.cloneElement(event.icon, { size: 36, strokeWidth: 0.8 })}
                        </div>
                        <div className="flex-1 space-y-8">
                          <div className="space-y-3">
                            <span className="text-[10px] font-bold uppercase tracking-[0.4em] text-[#9E7E44]">{event.theme}</span>
                            <h3 className="text-4xl font-serif text-[#333333]">{event.title}</h3>
                            <p className="text-[#9E7E44] font-serif italic text-xl opacity-80">{event.subtitle}</p>
                          </div>

                          <div className="grid grid-cols-1 md:grid-cols-2 gap-8 text-[#555555]">
                            <div className="flex items-center gap-4 justify-center md:justify-start">
                              <Icons.Calendar size={20} className="text-[#9E7E44]" strokeWidth={1} />
                              <span className="text-base font-medium tracking-wide">{event.date}</span>
                            </div>
                            <div className="flex items-center gap-4 justify-center md:justify-start">
                              <Icons.Clock size={20} className="text-[#9E7E44]" strokeWidth={1} />
                              <span className="text-base font-medium tracking-wide">{event.time}</span>
                            </div>
                          </div>

                          <div className="flex items-start gap-4 text-[#555555] justify-center md:justify-start">
                            <Icons.MapPin size={20} className="text-[#9E7E44] flex-shrink-0 mt-1" strokeWidth={1} />
                            <span className="text-base font-medium leading-relaxed max-w-xs">{event.venue}</span>
                          </div>

                          <a
                            href={event.mapUrl}
                            target="_blank"
                            rel="noopener noreferrer"
                            className="inline-flex items-center gap-3 text-[11px] font-bold uppercase tracking-[0.4em] text-slate-400 hover:text-[#333333] border-b border-transparent hover:border-[#9E7E44] transition-all pb-2 mt-4"
                          >
                            Navigate to Location <Icons.ExternalLink size={14} />
                          </a>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            );
          case 'rsvp':
            if (isSubmitted) {
              return (
                <div className="animate-in zoom-in duration-1000 max-w-md mx-auto bg-white/80 backdrop-blur-md p-20 rounded-[5rem] border border-[#9E7E44]/20 shadow-2xl text-center space-y-10">
                  <CoupleLogo className="w-28 h-28 mx-auto" />
                  <div className="space-y-4">
                    <h2 className="text-5xl font-serif text-[#333333]">With Gratitude</h2>
                    <p className="text-[#666666] font-serif italic text-xl leading-relaxed">Your response has been registered. We await the honor of your company.</p>
                  </div>
                  <button onClick={() => setIsSubmitted(false)} className="text-[10px] uppercase tracking-[0.4em] font-bold text-[#9E7E44] hover:text-[#333333] transition-colors border-b border-[#9E7E44]/30 pb-1">Modify Response</button>
                </div>
              );
            }
            return (
              <div className="animate-in zoom-in duration-1000 max-w-2xl mx-auto bg-white/60 backdrop-blur-2xl p-14 rounded-[5rem] border border-white shadow-2xl space-y-16 relative overflow-hidden text-center">
                <div className="space-y-4">
                  <h2 className="text-6xl font-serif text-[#333333]">RSVP</h2>
                  <p className="text-[#9E7E44] font-serif italic text-xl">We'd be honored to have you.</p>
                </div>

                <form className="space-y-14" onSubmit={handleSubmitRsvp}>
                  <div className="space-y-12">
                    <div className="space-y-4 text-left">
                      <label className="text-[11px] uppercase tracking-[0.4em] font-bold text-[#9E7E44] ml-8">Full Name</label>
                      <input
                        type="text" required
                        value={rsvpData.name}
                        onChange={(e) => setRsvpData({ ...rsvpData, name: e.target.value })}
                        className="w-full p-8 bg-[#F8F5F2]/50 rounded-[3rem] border border-[#9E7E44]/10 focus:ring-4 focus:ring-[#9E7E44]/5 focus:bg-white outline-none transition-all placeholder:text-slate-300 italic font-serif text-xl"
                        placeholder="Guest name..."
                      />
                    </div>

                    <div className="space-y-4 text-left">
                      <label className="text-[11px] uppercase tracking-[0.4em] font-bold text-[#9E7E44] ml-8">Contact Number</label>
                      <input
                        type="tel" required
                        value={rsvpData.phone}
                        onChange={(e) => setRsvpData({ ...rsvpData, phone: e.target.value })}
                        className="w-full p-8 bg-[#F8F5F2]/50 rounded-[3rem] border border-[#9E7E44]/10 focus:ring-4 focus:ring-[#9E7E44]/5 focus:bg-white outline-none transition-all placeholder:text-slate-300 italic font-serif text-xl"
                        placeholder="Enter number..."
                      />
                      <p className="text-[11px] text-slate-400 ml-8 font-serif italic">Please enter with your country code (e.g. +91 00000 00000)</p>
                    </div>
                  </div>

                  <div className="space-y-4 text-left">
                    <label className="text-[11px] uppercase tracking-[0.4em] font-bold text-[#9E7E44] ml-8">Guest Party Count</label>
                    <div className="flex items-center justify-between p-7 bg-[#F8F5F2]/50 rounded-[3rem] border border-[#9E7E44]/10 shadow-inner">
                      <div className="flex items-center gap-4 ml-4 text-[#666666]">
                        <Icons.Users className="text-[#9E7E44]" size={24} strokeWidth={1} />
                        <span className="text-lg font-medium">Number attending</span>
                      </div>
                      <div className="flex items-center gap-8 mr-4">
                        <button type="button" onClick={() => adjustGuests(-1)} className="w-14 h-14 rounded-3xl bg-white border border-[#9E7E44]/10 flex items-center justify-center text-[#9E7E44] hover:bg-[#333333] hover:text-white transition-all shadow-sm active:scale-90"><Icons.Minus size={20} /></button>
                        <span className="text-3xl font-serif text-[#333333] w-8 text-center">{rsvpData.guests}</span>
                        <button type="button" onClick={() => adjustGuests(1)} className="w-14 h-14 rounded-3xl bg-white border border-[#9E7E44]/10 flex items-center justify-center text-[#9E7E44] hover:bg-[#333333] hover:text-white transition-all shadow-sm active:scale-90"><Icons.Plus size={20} /></button>
                      </div>
                    </div>
                  </div>

                  <div className="space-y-8 text-left">
                    <label className="text-[11px] uppercase tracking-[0.4em] font-bold text-[#9E7E44] ml-8">Ceremonies to Attend</label>
                    <div className="grid grid-cols-1 gap-6">
                      {events.map((event) => (
                        <button
                          key={event.id}
                          type="button"
                          onClick={() => setRsvpData({ ...rsvpData, events: { ...rsvpData.events, [event.id]: !rsvpData.events[event.id] } })}
                          className={`flex items-center justify-between p-8 rounded-[3.5rem] border-2 transition-all duration-700 ${rsvpData.events[event.id] ? 'bg-white border-[#9E7E44]/40 shadow-xl' : 'bg-transparent border-transparent opacity-40'}`}
                        >
                          <div className="flex items-center gap-6 text-left">
                            <div className={`p-4 rounded-3xl transition-all duration-700 ${rsvpData.events[event.id] ? 'bg-[#F8F5F2] scale-110' : 'bg-slate-100'}`}>
                              {React.cloneElement(event.icon, { size: 24 })}
                            </div>
                            <div>
                              <p className="font-bold text-[12px] tracking-[0.3em] uppercase text-[#333333]">{event.title}</p>
                              <p className="text-xs text-[#9E7E44] italic font-serif mt-1">{event.date}</p>
                            </div>
                          </div>
                          <div className={`w-8 h-8 rounded-full border-2 flex items-center justify-center transition-all duration-700 ${rsvpData.events[event.id] ? 'bg-[#9E7E44] border-[#9E7E44] text-white scale-125' : 'border-slate-200'}`}>
                            {rsvpData.events[event.id] && <Icons.Check size={18} strokeWidth={4} />}
                          </div>
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="space-y-4 text-left">
                    <label className="text-[11px] uppercase tracking-[0.4em] font-bold text-[#9E7E44] ml-8">Blessings & Message</label>
                    <textarea
                      value={rsvpData.message}
                      onChange={(e) => setRsvpData({ ...rsvpData, message: e.target.value })}
                      className="w-full p-8 bg-[#F8F5F2]/50 rounded-[3rem] border border-[#9E7E44]/10 focus:ring-4 focus:ring-[#9E7E44]/5 focus:bg-white outline-none transition-all placeholder:text-slate-300 shadow-inner italic font-serif text-xl h-40 resize-none"
                      placeholder="Share your blessings..."
                    />
                  </div>

                  <button
                    type="submit"
                    disabled={isSubmitting || !user}
                    className="w-full py-8 bg-[#333333] text-white rounded-[3.5rem] font-bold text-[12px] uppercase tracking-[0.6em] hover:bg-[#9E7E44] transition-all duration-1000 shadow-2xl disabled:opacity-50 flex items-center justify-center gap-4 active:scale-95"
                  >
                    {isSubmitting ? <Icons.Loader2 className="animate-spin" size={24} /> : "Register Attendance"}
                  </button>
                </form>
              </div>
            );
          default:
            return null;
        }
      };

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    }; // End of App Component definition.

    // Initialize and Render
    // We ensure strict mode or direct render
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
